<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-1'), detectAudio: false });
  firstHydra.synth
    .noise(3, 0.5)
    .color(0, 1, 0)
    .repeat(5, 3, 0.2, 0.2)
    .out();
  firstHydra.synth.render(firstHydra.synth.o0);

  const secondHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-2'), detectAudio: false });
  secondHydra.synth
    .shape(3, 0.2, 0.7)
    .scrollX(0.3, 3)
    .scrollY(3, 5)
    .kaleid(8)
    .color(1, 0, 2)
    .repeat(3)
    .out();
  secondHydra.synth.render(secondHydra.synth.o0);

  const thirdHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-3'), detectAudio: false });
  thirdHydra.synth
    .noise(3, 0.3)
    .color(22, 2, 8)
    .posterize(8)
    .out();
  thirdHydra.synth.render(thirdHydra.synth.o0);

  const fourthHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-4'), detectAudio: false });
  fourthHydra.synth
    .osc(15, 2.01, 1.1)
    .color(0.7)
    .modulateKaleid(fourthHydra.synth.noise(10))
    .out();
  fourthHydra.synth.render(fourthHydra.synth.o0);

  const fifthHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-5'), detectAudio: false });
  fifthHydra.synth
    .voronoi(5, 2.01, 1.1)
    .color(2.7)
    .modulateRotate(fifthHydra.synth.osc(20))
    .out();
  fifthHydra.synth.render(fifthHydra.synth.o0);
</script>
