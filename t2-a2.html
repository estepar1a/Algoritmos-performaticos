<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydra = new Hydra({
    canvas: document.getElementById('hydra-canvas-1'),
    detectAudio: false
  });
  const firstSynth = firstHydra.synth;

  firstSynth.s0.initCam();
  firstSynth
    .voronoi()
    .modulateScale(firstSynth.s0, () => Math.sin(time) * 0.8)
    .colorama(() => Math.sin(time / 4))
    .out(firstSynth.o0);
  firstSynth.render(firstSynth.o0);

  const secondHydra = new Hydra({
    canvas: document.getElementById('hydra-canvas-2'),
    detectAudio: false
  });
  const secondSynth = secondHydra.synth;
  secondSynth.setResolution(4000, 4000);

  const n = 4;
  const pattern = () => secondSynth.solid(0.01, 0.01, 0.1)
    .add(secondSynth.shape([3.3, 3, 2.5].smooth(), 0.5).repeat(n, n));
  const red = [0.7, 0.1, 0.1].smooth();
  const green = [0.1, 0.7, 0.1].ease();
  const blue = [0.1, 0.1, 0.7].smooth();

  pattern()
    .add(pattern().scroll(0.5 / n, 0.5 / n))
    .modulate(secondSynth.osc(5))
    .out(secondSynth.o1);
  secondSynth
    .src(secondSynth.o1)
    .color(red, green, blue)
    .diff(secondSynth.src(secondSynth.o1).rotate([-0.1, 0.09].smooth()))
    .out(secondSynth.o0);
  secondSynth.render(secondSynth.o0);

  const secondSketchCode = `setResolution(4000,4000)

var n = 4
var a = () => solid(.01,.01,.1).add(shape([3.3,3,2.5].smooth(),0.5).repeat(n,n))

a().add(a().scroll(.5/n,.5/n)).modulate(osc(5)).out(o1)

var r = [.7,.1,.1].smooth()
var g = [.1,.7,.1].ease()
var b = [.1,.1,.7].smooth()
src(o1).color(r,g,b).diff(src(o1).rotate([-.1,.09].smooth())).out()`;
  document.getElementById('second-sketch-link').href =
    'https://hydra.ojack.xyz/?code=' + encodeURIComponent(secondSketchCode);
</script>
