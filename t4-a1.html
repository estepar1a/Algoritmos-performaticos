<body>
<div class="frame">

  <div class="topbar">
   <a class="brand" href="index.html" aria-label="Ir al inicio">

    <nav>

  </div>

  <div class="page-head">
    <h1>Catalina Florencia Sanchez</h1>
  </div>

  <div class="section-label">
    <h2>Composiciones</h2>
  </div>

  <div class="works-grid">
      <div class="work">
        <div class="media hydra-media">
          <canvas id="hydra-canvas-1" aria-label="Sketch geométrico de Hydra"></canvas>
        </div>
        <div class="work-info">
          <div class="t">Hydra</div>
        </div>
      </div>
      <div class="work">
        <div class="media hydra-media">
          <canvas id="hydra-canvas-2" aria-label="Sketch visual de Hydra"></canvas>
        </div>
        <div class="work-info">
          <div class="t">Hydra + Cámara</div>
        </div>
      </div>

  <a class="back-link" href="taller-4.html">← Volver</a>

  <footer>
    <span>Algorítmos Performáticos</span>
  </footer>

</div>

<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydraCanvas = document.getElementById('hydra-canvas-1');
  const firstHydra = new Hydra({ canvas: firstHydraCanvas, detectAudio: false });
  const firstSynth = firstHydra.synth;

  firstSynth
    .shape(10)
    .scale(2, 2)
    .scrollX(1, 0.5)
    .repeat(2, 10)
    .kaleid(6)
    .color(1, 0.5, 0.7)
    .rotate(Math.PI * 2, 0.4)
    .add(firstSynth.osc(20, 0.5, 0, 8), 0.15)
    .out(firstSynth.o0);
  firstSynth.render(firstSynth.o0);

  const secondHydraCanvas = document.getElementById('hydra-canvas-2');
  const secondHydra = new Hydra({ canvas: secondHydraCanvas, detectAudio: false });
  const secondSynth = secondHydra.synth;

  secondSynth.s1.initCam();

  secondSynth
    .src(secondSynth.s1)
    .out(secondSynth.o1);

  secondSynth.s0.initVideo('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdmF4ZnVtenp1YWhoYzlrdzdyYWpoOW1nY3plM3h4Y29rMDNsZmY2YyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/mEJMfDJQntvjDhdDJv/giphy.mp4');

  secondSynth
    .src(secondSynth.s0)
    .scrollX(1, 0.3)
    .add(secondSynth.src(secondSynth.o1), 0.6)
    .color(0.1, 0.4, 0.3)
    .out(secondSynth.o0);

  secondSynth.render(secondSynth.o0);
</script>
<script src="script.js"></script>
</body>
</html>
