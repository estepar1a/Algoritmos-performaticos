<script>
  const hydraCanvas = document.getElementById('hydra-canvas-1');
  const hydra = new Hydra({ canvas: hydraCanvas, detectAudio: true });
  const synth = hydra.synth;

  synth.s0.initImage('https://i.imgur.com/rBkbXS3.jpeg');
  synth.s1.initCam();
  synth
    .src(synth.s0)
    .modulateScale(synth.s1)
    .blend(
      synth.src(synth.s1)
        .colorama(() => synth.a.fft[0], () => synth.a.fft[0], () => synth.a.fft[0])
        .scale(() => synth.a.fft[0])
        .rotate([0.209, Math.random(), Math.random()].smooth(17.315))
    )
    .out(synth.o0);
  synth.render(synth.o0);

  const hydraCanvas2 = document.getElementById('hydra-canvas-2');
  const hydra2 = new Hydra({ canvas: hydraCanvas2, detectAudio: true });
  const synth2 = hydra2.synth;

  synth2.s0.initImage('https://i.imgur.com/rBkbXS3.jpeg');
  synth2.s1.initCam();
  synth2
    .src(synth2.s0)
    .modulate(synth2.osc(10))
    .modulateScale(synth2.s1)
    .blend(
      synth2.src(synth2.s1)
        .colorama(() => synth2.a.fft[0], 0, 0)
        .scale([6, 6.5, 5.5].smooth())
        .rotate([0.1, Math.random(), 0.3].smooth(10))
    )
    .out(synth2.o0);
  synth2.render(synth2.o0);

  const hydraCanvas3 = document.getElementById('hydra-canvas-3');
  const hydra3 = new Hydra({ canvas: hydraCanvas3, detectAudio: false });
  const synth3 = hydra3.synth;

  synth3.speed = 0.2;
  synth3
    .noise(4, 0.3, 0.9)
    .colorama(0.9450980392156862, 0.12941176470588237, 0.12941176470588237)
    .pixelate([10, 20, 30, 40, 50, 60, 70, 80].smooth())
    .rotate([0.1, 0.8, 0.5, 0.3].smooth())
    .out(synth3.o0);
  synth3.render(synth3.o0);

  const hydraCanvas4 = document.getElementById('hydra-canvas-4');
  const hydra4 = new Hydra({ canvas: hydraCanvas4, detectAudio: false });
  const synth4 = hydra4.synth;
  synth4.speed = 0.5;
  const modelUrl = 'https://raw.githubusercontent.com/Marcospucineri/demo/master/d95b6011b148_a_octopus_squid_alp.obj';
  let model3d;
  let p5Canvas4;

  const p5Sketch4 = new p5((p) => {
    p.preload = () => {
      model3d = p.loadModel(modelUrl, true);
    };

    p.setup = () => {
      p5Canvas4 = p.createCanvas(360, 225, p.WEBGL).elt;
      p5Canvas4.style.display = 'none';
      p.frameRate(30);
      synth4.s0.init({ src: p5Canvas4 });
      synth4
        .src(synth4.s0)
        .blend(
          synth4.shape(
            [10, 99, 8, 24].fast(5),
            [0.25, 0.25, 0.25, 0.1].smooth(),
            [0.4, 0.2, 0.8, 0.1].smooth()
          )
            .color(0.91, 0.2, 1.29)
            .scale(1, 0.45)
        )
        .out(synth4.o0);
      synth4.render(synth4.o0);
    };

    p.draw = () => {
      p.background(10, 20, 30, 0.5);
      p.scale(2);
      p.fill('#fff');
      p.stroke('#000');
      p.strokeWeight(0.5);
      p.rotateY(p.frameCount / 30);
      p.rotateX(p.frameCount / 30);
      p.model(model3d);
    };
  });
</script>
