<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-1'), detectAudio: false });
  const firstSynth = firstHydra.synth;
  firstSynth.s0.initCam();
  firstSynth.src(firstSynth.s0)
    .pixelate(50, 50)
    .repeat(3, 3)
    .modulate(firstSynth.osc(10, 0.2, 100), 0.5)
    .luma(0.1)
    .out(firstSynth.o0);
  firstSynth.render(firstSynth.o0);

  let secondMouseX = 0;
  const secondCanvas = document.getElementById('hydra-canvas-2');
  secondCanvas.addEventListener('pointermove', (event) => {
    secondMouseX = event.offsetX;
  });
  const secondHydra = new Hydra({ canvas: secondCanvas, detectAudio: false });
  const secondSynth = secondHydra.synth;
  secondSynth.osc(8, -0.5, 1)
    .color(-1.5, -1.5, -1.5)
    .rotate(-0.5, -0.5)
    .modulate(secondSynth.o0, () => secondMouseX * 0.00001)
    .out(secondSynth.o0);
  secondSynth.render(secondSynth.o0);

  const thirdHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-3'), detectAudio: false });
  const thirdSynth = thirdHydra.synth;
  thirdSynth.s0.initImage('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwkzVju7CfQsPVnKem1etYHhEPvZ2WGpd-1a_n5bEegg&s');
  thirdSynth.src(thirdSynth.s0)
    .scale(1, 1)
    .modulateKaleid(thirdSynth.noise(2), 5)
    .out(thirdSynth.o0);
  thirdSynth.render(thirdSynth.o0);

  const fourthHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-4'), detectAudio: false });
  const fourthSynth = fourthHydra.synth;
  fourthSynth.osc(10, 0.1, 1.2)
    .blend(fourthSynth.noise(3))
    .modulatePixelate(fourthSynth.noise(3), 2, 5)
    .out(fourthSynth.o0);
  fourthSynth.render(fourthSynth.o0);

  const fifthHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-5'), detectAudio: false });
  const fifthSynth = fifthHydra.synth;
  fifthSynth.s0.initCam();
  fifthSynth.src(fifthSynth.s0)
    .blend(fifthSynth.noise(3))
    .diff(fifthSynth.noise(0.5, 0.5).rotate(0, 0.05))
    .out(fifthSynth.o0);
  fifthSynth.render(fifthSynth.o0);
</script>
