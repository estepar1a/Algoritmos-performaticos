<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">

  <div class="topbar">
    <a class="brand" href="index.html" aria-label="Ir al inicio">
      Algorítmos Performáticos
    </a>
    <nav>
      <a href="taller.html">El taller</a>
      <a href="bio.html">Bio</a>
      <a href="bio.html#contacto">Contacto</a>
    </nav>
  </div>

  <div class="page-head">
    <h1>Eduardo Veiga</h1>
  </div>

  <div class="section-label">
    <h2>Composiciones</h2>
  </div>

  <div class="works-grid">
    <div class="work">
      <a class="hydra-preview-link" href="https://hydra.ojack.xyz/?sketch_id=nFeRsnsI7kF9EadU" target="_blank" rel="noopener noreferrer" aria-label="Abrir composición Hydra en Hydra">
        <div class="media hydra-media">
          <canvas id="hydra-canvas-1" aria-label="Previsualización de composición Hydra"></canvas>
        </div>
      </a>
      <div class="work-info">
        <div class="t">Hydra</div>
      </div>
    </div>
    <div class="work">
      <a class="hydra-preview-link" href="https://hydra.ojack.xyz/?sketch_id=SEWzznqiirElpXih" target="_blank" rel="noopener noreferrer" aria-label="Abrir composición Hydra y P5 en Hydra">
        <div class="media hydra-media">
          <canvas id="hydra-canvas-2" aria-label="Previsualización de composición Hydra y P5"></canvas>
        </div>
      </a>
      <div class="work-info">
        <div class="t">Hydra + P5</div>
      </div>
    </div>
  </div>

  <a class="back-link" href="taller-1.html">← Volver a Algorítmos Performáticos I</a>

  <footer>
    <span>Algorítmos Performáticos</span>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydra = new Hydra({
    canvas: document.getElementById('hydra-canvas-1'),
    detectAudio: false
  });
  const firstSynth = firstHydra.synth;
  const aspectRatio = window.innerHeight / window.innerWidth;

  firstSynth
    .src(firstSynth.o0)
    .invert()
    .scale(0.95, 1, 1)
    .scrollX([-0.01, 0.01, 0.015, 0].fast(4))
    .scrollY([0.01, -0.01, 0.02, 0, 0])
    .mask(firstSynth.shape(100, 0.3, 0.001).scale(3.2, aspectRatio, 1))
    .out(firstSynth.o0);
  firstSynth.render(firstSynth.o0);

  const secondHydra = new Hydra({
    canvas: document.getElementById('hydra-canvas-2'),
    detectAudio: false
  });
  const secondSynth = secondHydra.synth;
  let p5Canvas;
  const p5Sketch = new p5((p) => {
    p.setup = () => {
      p5Canvas = p.createCanvas(360, 225).elt;
      p5Canvas.style.display = 'none';
      p.noLoop();
      secondSynth.s1.init({ src: p5Canvas });
      secondSynth
        .src(secondSynth.o0)
        .scale(1.01, [1, 1.2, 1], [1, 0.9, 1, 1.3].fast(2))
        .layer(secondSynth.src(secondSynth.s1))
        .out(secondSynth.o0);
      secondSynth.render(secondSynth.o0);
    };

    p.draw = () => {
      p.clear();
      p.stroke(200, 255, 0);
      p.strokeWeight(5);
      p.colorMode(p.HSL, 255);
      p.fill(p.random(150), 200, 140);
      p.rect(
        p.map(p.random(), 0, 1, p.width / 3, p.width * 2 / 3),
        p.map(p.random(), 0, 1, p.height / 3, p.height * 2 / 3),
        p.map(p.random(), 0, 1, 20, 200),
        p.map(p.random(), 0, 1, 20, 200)
      );
    };
  });
</script>
<script src="script.js"></script>
</body>
</html>
