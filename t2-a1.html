<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydra = new Hydra({
    canvas: document.getElementById('hydra-canvas-1'),
    detectAudio: false
  });
  const firstSynth = firstHydra.synth;

  firstSynth.s0.initImage('https://th.bing.com/th/id/R.83419975950a636bfa5afa2e363b4573?rik=FEW6EpavjVDLfQ&riu=http%3A%2F%2F2.bp.blogspot.com%2F-dsLgCdKVsBk%2FT8fFefjjX0I%2FAAAAAAAAJ-s%2FNcW51zseSks%2Fs1600%2FThe_Great_Wave_off_Kanagawa.jpg&ehk=mXiM8EePMazc96vX7hg5LoC3eHxKRhBsdrVrtb5y4z4%3D&risl=&pid=ImgRaw&r=0');
  firstSynth
    .src(firstSynth.s0)
    .scale(1, 0.8)
    .add(
      firstSynth.osc()
        .sub(firstSynth.osc(1))
        .color([1, 0, 0, 1, 0], [0, 1, 0, 1, 0], [0, 0, 1, 1, 0.077])
    )
    .rotate([0, 0], [5, 0.5], [10, 0.1])
    .kaleid([1, 2, 5, 2, 1, 1])
    .out(firstSynth.o0);
  firstSynth.render(firstSynth.o0);

  const secondHydra = new Hydra({
    canvas: document.getElementById('hydra-canvas-2'),
    detectAudio: false
  });
  const secondSynth = secondHydra.synth;

  secondSynth.s0.initCam();
  secondSynth
    .src(secondSynth.s0)
    .scale(1.4, 0.8)
    .rotate(1, 0.1)
    .color([2, 0.3, 5])
    .kaleid(5, 0, 0, 3)
    .out(secondSynth.o0);
  secondSynth.render(secondSynth.o0);
</script>
