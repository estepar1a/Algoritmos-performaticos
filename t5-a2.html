<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const hydraCanvases = Array.from({ length: 9 }, (_, index) => {
    const hydra = new Hydra({ canvas: document.getElementById(`hydra-canvas-${index + 1}`), detectAudio: false });
    return hydra.synth;
  });

  const [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth] = hydraCanvases;

  first
    .voronoi(34, 2, 10.3)
    .kaleid(4, 22)
    .rotate(1, 0.1)
    .scale()
    .color(4, 2, 22)
    .colorama(3, 5)
    .posterize(8, 2)
    .hue(12, 3, 22)
    .out();
  first.render(first.o0);

  second.src(second.o0)
    .layer(second.shape(2, 0.1, 0).r().color(0, 0, 0))
    .layer(second.shape(4, 0.2, 0).scale(1, 0.5).r().mult(second.osc(3, 0.2, 1.5)))
    .modulate(second.osc(1, 1).brightness(-0.5).color(1, 0), 1)
    .modulateRotate(
      second.osc(1, 1).mult(second.osc(1, 1)).add(second.osc(2, 1), 0.3).pixelate(1, 1).brightness(-0.5)
    )
    .out();
  second.render(second.o0);

  third.voronoi(7).modulateScale(third.noise(12)).colorama(1, 5, 0).out();
  third.render(third.o0);

  fourth.voronoi(18).modulateScale(fourth.noise(6)).colorama(7, 8).posterize(15, 9).out();
  fourth.render(fourth.o0);

  fifth.voronoi(8).modulateRotate(fifth.noise(62)).kaleid(7, 8).posterize(15, 1).hue(1, 8, 9).rotate(0.1, 0.01).out();
  fifth.render(fifth.o0);

  sixth.voronoi(5).modulateRotate(sixth.noise(52)).kaleid(1, 33).posterize(19, 4).colorama(1).out();
  sixth.render(sixth.o0);

  seventh.osc(12).modulateKaleid(seventh.noise(2)).kaleid(2, 33).posterize(12, 2).colorama(1).out();
  seventh.render(seventh.o0);

  eighth.osc().modulate(eighth.noise(12).modulate(eighth.o0).modulateRotate(eighth.osc(8, 0.01, 0.1)))
    .posterize(4, 1).color(17, 2).out();
  eighth.render(eighth.o0);

  ninth.osc(9, 0.02, 7.3).color(1.2, 0.7)
    .modulateRotate(ninth.osc(16, 0.1, 0.1))
    .posterize(1222, 7)
    .modulateRotate(ninth.osc(22, 0.01, 0.01))
    .out();
  ninth.render(ninth.o0);
</script>
