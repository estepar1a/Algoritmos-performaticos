<script src="https://unpkg.com/hydra-synth"></script>
<script>
  const firstHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-1'), detectAudio: false });
  const firstSynth = firstHydra.synth;
  firstSynth.osc(200, 0.01, 0).modulate(firstSynth.noise([2, 3, 1].smooth())).luma(0.1).out(firstSynth.o0);
  firstSynth.noise(130, 0.7, 50).modulate(firstSynth.noise(20)).modulate(firstSynth.osc(5, 0.2, 0))
    .layer(firstSynth.shape(4).scale([1, 2, 0.3].smooth(), 1, 1.2).modulate(firstSynth.noise([4, 2, 1].ease())).colorama(0.6))
    .layer(firstSynth.src(firstSynth.o0).brightness(-0.2).scale([2, 1, 3].ease(), 1, 1).rotate(10, 0.2))
    .diff(firstSynth.o1).out(firstSynth.o1);
  firstSynth.render(firstSynth.o1);

  const secondHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-2'), detectAudio: false });
  const secondSynth = secondHydra.synth;
  secondSynth.s1.initImage('https://i.imgur.com/xImtqw9.png');
  secondSynth.src(secondSynth.s1).scale(0.5, 0.5, 1).thresh(0.4, 0.08).colorama(0.2)
    .modulate(secondSynth.noise([1.4, 1, 0.8].ease())).diff(secondSynth.o1)
    .modulate(secondSynth.gradient(100), 1).scroll(1, -1, 0.1, 0.1).out(secondSynth.o0);
  secondSynth.noise(20).modulate(secondSynth.osc(2, 0.3, 1)).rotate(20, 0.3).diff(secondSynth.o1)
    .luma(0.4).hue(20).mult(secondSynth.o0).colorama(0.08).out(secondSynth.o1);
  secondSynth.render(secondSynth.o0);

  const thirdHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-3'), detectAudio: false });
  const thirdSynth = thirdHydra.synth;
  thirdSynth.noise(40, 0.9).modulate(thirdSynth.noise(2)).mult(thirdSynth.o1).out(thirdSynth.o0);
  thirdSynth.osc(30, 0.2, 0.8).modulate(thirdSynth.noise(1)).out(thirdSynth.o1);
  thirdSynth.src(thirdSynth.o2).modulateHue(thirdSynth.src(thirdSynth.o2).scale(1.01), 1)
    .layer(thirdSynth.osc(5, 0.2, 2).mask(thirdSynth.shape(4, 0.5, 0.5).rotate(10, 0.8)))
    .modulate(thirdSynth.noise(3)).diff(thirdSynth.o0).modulateScale(thirdSynth.o2, 0.1).out(thirdSynth.o2);
  thirdSynth.render(thirdSynth.o2);

  const fourthHydra = new Hydra({ canvas: document.getElementById('hydra-canvas-4'), detectAudio: false });
  const fourthSynth = fourthHydra.synth;
  fourthSynth.osc(4.05, 0.5, 2).modulateHue(fourthSynth.src(fourthSynth.o0).scale(1.01), 1)
    .modulateRotate(fourthSynth.osc(0.9, 0.3, 0).scale(0.5), 15, 0)
    .layer(fourthSynth.osc(8, 0.5, 2).mask(fourthSynth.shape(50, 0.5, 0.001)).scale(1.9, 0.6, 2)
      .modulate(fourthSynth.noise(3), 0.5, 1)
      .modulateRotate(fourthSynth.osc(1, 0.3, 0).scale(0.9), 15, 0).rotate(0.3, 0.3))
    .modulateScale(fourthSynth.osc([-100, -200, -50, 10].smooth(), -0.02, -6).scale(-0.1), 0.2, 2)
    .out(fourthSynth.o0);
  fourthSynth.render(fourthSynth.o0);
</script>
